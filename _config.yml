encoding: utf-8

# ── Site ──
title: 设计者笔记
email: jskyzero@outlook.com
description: "jskyzero's notes about game designer."
baseurl: ""
url: "https://design.jskyzero.com"
twitter_username: jskyzero
github_username: jskyzero

# ── Style ──
style: light
listen_for_clients_preferred_style: false

# ── Header navigation ──
header_pages:
  - index.md
  - index.github.md
  - index.resume.md
  - index.project.md

# ── Footer ──
footer: 'Enjoy :)'

# ── Home page categories & ordering ──
# Categories displayed on home page (in order)
index_categories:
  - 动作游戏设计
  - 动作游戏分析
  - 游戏AI
  - 专题报告
  - 一期一会
  - 游戏开发
  - 摘录与杂谈

# Categories sorted by title instead of date
index_categories_sort_by_title:
  - 游戏AI
  - 游戏开发
  - 摘录与杂谈

# Custom post ordering by category (higher = first)
# Posts not listed keep their default order
index_categories_post_order:
  摘录与杂谈:
    - "归档：零碎文章集合"
  游戏AI:
    - "GameAIPro·总集篇"

# ── Plugins ──
plugins:
  - jekyll-feed
  - jekyll-mermaid
  - jekyll-seo-tag

# ── Markdown ──
markdown: kramdown
highlighter: rouge

# ── Permalink ──
permalink: /:year/:month/:day/:title/

# ── Theme paths ──
layouts_dir: _theme/_layouts
includes_dir: _theme/_includes
plugins_dir: _theme/_plugins
sass:
  sass_dir: _theme/_sass

# ── Features ──
git_log: true

# ── Mermaid ──
mermaid:
  src: '/assets/js/mermaid.min.js'

# ── Disqus ──
disqus:
  shortname: designer-notes

# ── Exclude from build ──
exclude:
  - _posts/日常
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
