encoding: utf-8

title: 设计者笔记
email: jskyzero@outlook.com
description: jskyzero's notes about game designer.
baseurl: ""
url: "https://design.jskyzero.com"
twitter_username: jskyzero
github_username: jskyzero

footer: 'Enjoy :)'
git_log: true

nav:
  header_pages:
    - index.md
    - index.github.md
    - index.resume.md
    - index.project.md

home:
  # Use `manual_posts` when a category needs explicit ordering.
  # Items are post paths under the repository root.
  categories:
    - name: 动作游戏设计
    - name: 动作游戏分析
    - name: 游戏AI
    - name: 专题报告
    - name: 一期一会
    - name: 游戏开发
    - name: 摘录与杂谈
      manual_posts:
        - _posts/6.摘录与杂谈/阅读笔记/2021-11-14-possessiveness.md
        - _posts/6.摘录与杂谈/2025-07-05-collect.md

plugins:
  - jekyll-feed
  - jekyll-mermaid
  - jekyll-seo-tag

mermaid:
  src: '/assets/js/mermaid.min.js'

layouts_dir: _theme/_layouts
includes_dir: _theme/_includes
plugins_dir: _theme/_plugins

sass:
  sass_dir: _theme/_sass

disqus:
  shortname: designer-notes

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

exclude:
  - _posts/日常
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg
