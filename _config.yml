plugins:
  - jekyll-feed
  - jekyll-mermaid
  - jekyll-seo-tag

mermaid:
  src: '/assets/js/mermaid.min.js'

layouts_dir: _theme/_layouts
includes_dir: _theme/_includes
plugins_dir: _theme/_plugins

sass:
  sass_dir: _theme/_sass

disqus:
  shortname: designer-notes

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

exclude:
  - _posts/日常
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg
