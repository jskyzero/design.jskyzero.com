<!--
  PRO.html - Post metadata badges
  Renders shields.io badges for categories, author, and date at the top of each blog post.
  Categories are extracted from post/page frontmatter.
-->
<div id="pro">
  {% if post.categories or page.categories %}
    {% if post %}
    {% assign categories = post.categories %}
    {% else %}
    {% assign categories = page.categories %}
    {% endif %}
    {% for category in categories %}
    <img src="https://img.shields.io/badge/{{category|slugize}}-blue.svg?style=flat" alt="">
    {% endfor %}
  {% endif %}
  <img src="https://img.shields.io/badge/作者-jskyzero-brightgreen.svg?style=flat" alt="">
  <img src="https://img.shields.io/badge/日期-{{ page.date | date: "%Y/%m/%d" }}-brightgreen.svg?style=flat" alt="">
</div>
