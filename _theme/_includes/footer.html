{% comment %}
  footer.html —— 站点页脚。

  将徽章排列在一行，形成紧凑的状态行末端风格。
  包含 GitHub 最后提交、Clarity 统计、busuanzi 访问量统计和版权信息。
{% endcomment %}
<footer class="site-footer">
  <p class="site-footer__message">{{ site.footer }}</p>
  <div class="site-footer__badges">
    <img src="https://img.shields.io/github/last-commit/jskyzero/design.jskyzero.com" alt="Last commit">
    <img src="https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/jskyzero/2b7d19a42054b8eff6e4b9b228a80079/raw/clarity-stats.json" alt="Clarity sessions">
    <img id="hits-badge" alt="hits" style="display:none">
    <img src="https://img.shields.io/badge/made with-♥-red" alt="Made with heart">
  </div>
  <p class="site-footer__copyright">&copy; 2017-{{ site.time | date: '%Y' }} {{ site.title | escape }}. All rights reserved.</p>
</footer>
<script>
  // 通过 busuanzi（不蒜子）JSONP 获取站点 PV，动态生成 shields.io 绿色 hits 徽章。
  // 纯前台实现，无需后端脚本；获取失败时徽章保持隐藏，不影响页面。
  (function () {
    var img = document.getElementById('hits-badge');
    if (!img) return;
    var cb = 'BusuanziCallback_' + Math.random().toString(36).slice(2);
    window[cb] = function (data) {
      try {
        var pv = data && data.site_pv;
        if (pv) {
          img.src = 'https://img.shields.io/badge/hits-' + pv + '-blue';
          img.style.display = '';
        }
      } finally {
        delete window[cb];
      }
    };
    var s = document.createElement('script');
    s.src = 'https://busuanzi.ibruce.info/busuanzi?jsonpCallback=' + cb + '&type=site_pv';
    document.body.appendChild(s);
  })();
</script>
