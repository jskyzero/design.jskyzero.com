<!-- head.html - Metadata, selected theme stylesheet, and analytics. -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Referrer-Policy" content="no-referrer, strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{ page.title }} | {{site.title}}</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.2.png">
  <link rel="preload" as="image" href="{{ '/assets/img/logo.2.png' | relative_url }}" fetchpriority="high">
  <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://www.clarity.ms">
  <link rel="preconnect" href="https://{{ site.disqus.shortname }}.disqus.com">
  <link rel="preload" as="style" href="https://fontsapi.zeoseven.com/159/main/result.css" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style" href="https://fonts.bunny.net/css?family=jetbrains-mono:400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/159/main/result.css">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=jetbrains-mono:400&display=swap">
  </noscript>

  {%- seo title=false -%}

  {% if page.robots %}
    <meta name="robots" content="{{page.robots}}" />
  {% endif %}

  <link rel="stylesheet" type="text/css" href="{{ "/assets/main-light.css" | relative_url }}">


  {%- include google-analytics.html -%}
  {%- include clarity-analytics.html -%}
</head>
