<!-- head.html - Metadata, selected theme stylesheet, analytics, and legacy syntax highlighting. -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{ page.title }} | {{site.title}}</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.2.png">
  <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>

  {%- seo title=false -%}

  {% if page.robots %}
    <meta name="robots" content="{{page.robots}}" />
  {% endif %}

  <link rel="stylesheet" type="text/css" href="{{ "/assets/main-light.css" | relative_url }}">


  {%- include google-analytics.html -%}
  {%- include clarity-analytics.html -%}


  <!-- highlight.js is kept as a legacy enhancement for posts that render raw code blocks. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/highlight.min.js"></script>
</head>
