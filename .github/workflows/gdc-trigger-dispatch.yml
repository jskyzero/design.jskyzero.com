name: 🚀 触发 GDC.ACT 构建

on:
  push:
    branches:
      - jekyll # 监控的分支
    paths:
      - '_posts/1.动作游戏分析/经典/2023-11-13-ACT_with_GDC.md' # 监控特定的分析文件

jobs:
  trigger:
    name: 发送 Repository Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: 触发远程仓库构建
        # 使用 peter-evans 的 action 替代复杂的 curl 命令
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GDC_PAT }}
          repository: jskyzero/GDC.ACT
          event-type: trigger-build