name: 🛠️ Jekyll 自动构建与部署

on:
  push:
    branches: [ jekyll ]
  pull_request:
    branches: [ jekyll ]

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: jekyll
          fetch-depth: 0 # 获取完整历史，供 log.rb 的 git log 插件使用

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 缓存响应式图片
        uses: actions/cache@v4
        with:
          path: |
            assets/generated/img
            _data/responsive_images.json
          key: responsive-images-${{ runner.os }}-${{ hashFiles('assets/img/**/*') }}
          restore-keys: |
            responsive-images-${{ runner.os }}-

      - name: 安装 Node 依赖
        run: npm ci

      - name: 生成响应式图片
        run: npm run images

      - name: 设置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true # 自动运行 bundle install 并缓存 gems

      - name: 构建 Jekyll 站点
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # 部署类步骤仅在实际 push 到 jekyll 分支时执行，避免 PR 触发发布。
      - name: 部署到 gh-pages 分支
        if: github.event_name == 'push' && github.ref == 'refs/heads/jekyll'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          SITE_DIR="$GITHUB_WORKSPACE/_site"
          # 阻止 GitHub Pages 对已构建产物做二次 Jekyll 处理
          touch "$SITE_DIR/.nojekyll"
          cd "$SITE_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "站点无变更，跳过部署。"
            exit 0
          fi
          git commit -q -m "deploy: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: 同步至远程服务器 (SSH)
        if: github.event_name == 'push' && github.ref == 'refs/heads/jekyll'
        uses: appleboy/ssh-action@v1
        with:
          host: "${{ secrets.HOST }}"
          username: "${{ secrets.USERNAME }}"
          port: "${{ secrets.PORT }}"
          key: "${{ secrets.SSHKEY }}"
          # 在服务器上执行拉取操作
          script: cd "${{ secrets.PROJECT_PATH }}" && git pull
