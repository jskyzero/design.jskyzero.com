name: 🛠️ Jekyll 自动构建与部署

on:
  push:
    branches: [ jekyll ]
  pull_request:
    branches: [ jekyll ]

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: jekyll
          fetch-depth: 0 # 获取完整历史以确保某些插件正常工作

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 缓存响应式图片
        uses: actions/cache@v4
        with:
          path: |
            assets/generated/img
            _data/responsive_images.json
          key: responsive-images-${{ runner.os }}-${{ hashFiles('assets/img/**/*') }}
          restore-keys: |
            responsive-images-${{ runner.os }}-

      - name: 安装 Node 依赖
        run: npm ci

      - name: 生成响应式图片
        run: npm run images

      - name: 设置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # 自动运行 bundle install 并缓存 gems

      - name: 设置 GitHub Pages 路径
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建 Jekyll 站点
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: 上传构建产物 (用于 Actions 内部流转)
        uses: actions/upload-pages-artifact@v3

      - name: 部署到 gh-pages 分支
        # 此步骤会将 _site 目录推送到当前仓库的 gh-pages 分支
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: "./_site"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步至远程服务器 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          # 在服务器上执行拉取操作
          script: cd ${{ secrets.PROJECT_PATH }} && git pull
