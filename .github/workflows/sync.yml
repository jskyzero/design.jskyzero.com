name: 📊 Clarity 数据同步 (Gist)

on:
  schedule:
    #- cron: '0 2 * * *' # 每天北京时间 10:00 运行
   - cron: '*/5 * * * *'  # 每 5 分钟运行一次（用于测试）
  workflow_dispatch:    # 支持手动运行

# 确保同一时间只有一个同步任务在跑
concurrency:
  group: clarity-sync
  cancel-in-progress: true

jobs:
  update:
    name: 更新 Gist 统计
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip' # 开启 pip 缓存

      - name: 安装依赖
        run: pip install requests

      - name: 运行同步脚本
        env:
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/update_gist.py
